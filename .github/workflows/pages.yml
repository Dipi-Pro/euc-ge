# ============================================================================
# Builds the site and publishes it to GitHub Pages on every push to main.
#
# The pages are generated by tools/build.mjs from data/catalog.js, data/i18n.js
# and content/. If the build fails (for example a broken internal link or a
# syntax error in catalog.js), nothing is published and the live site stays as
# it was.
#
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
# ============================================================================

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # cwebp makes the small WebP photos, ImageMagick the JPG share images.
      # If this step fails the build still works, using the original photos.
      - name: Install image tools
        continue-on-error: true
        run: sudo apt-get update -q && sudo apt-get install -y -q webp imagemagick

      # Resized photos are kept between runs, so only new or changed photos
      # are converted again.
      - name: Restore resized photos
        uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-${{ hashFiles('assets/wheels/**') }}
          restore-keys: img-

      - name: Build the site
        run: node tools/build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
